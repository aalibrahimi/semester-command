<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0e1014}#stage{width:1280px;height:720px}svg{display:block}</style>
</head><body><div id="stage"></div>
<script src="sortvid.js"></script>
<script>
const CODE = `def quicksort(a, lo, hi):
    if lo < hi:
        p = partition(a, lo, hi)
        quicksort(a, lo, p - 1)
        quicksort(a, p + 1, hi)

def partition(a, lo, hi):
    pivot = a[hi]
    i = lo - 1
    for j in range(lo, hi):
        if a[j] <= pivot:
            i += 1
            a[i], a[j] = a[j], a[i]
    a[i + 1], a[hi] = a[hi], a[i + 1]
    return i + 1
`;
const A0 = [2, 8, 7, 1, 3, 5, 6, 4];   // the slide's example (Lecture 9)
const X = (k) => 570 + k * 88, BASE = 468, BH = (v) => 30 + v * 32;

video({
  title: "Quicksort", sub: "CS 146 · Lecture 9 · partition, then recurse on both sides", code: CODE,
  build(rec) {
    const a = [...A0], n = a.length, final = new Set();
    const stack = [];
    // paint every bar for the current moment
    function paint({ lo = 0, hi = n - 1, i = null, j = null, pivotAt = null, scout = null, swap = [] } = {}) {
      a.forEach((v, k) => {
        let fill = C.slate, ring = null, op = 1;
        if (final.has(k)) fill = C.green;
        else if (k < lo || k > hi) op = 0.3;
        else if (pivotAt !== null && k === pivotAt) fill = C.violet;
        else if (i !== null && k >= lo && k <= i) fill = "#2b7a5c";
        else if (j !== null && k > i && k < j) fill = "#8a6427";
        if (k === scout) ring = C.blue;
        if (swap.includes(k)) ring = C.fg;
        rec.set("v" + v, { kind: "bar", x: X(k), y: BASE, h: BH(v), val: v, fill, ring, op, w: 60, z: swap.includes(k) ? 2 : 0 });
      });
      rec.ptrs = [];
      if (i !== null && i >= lo) rec.ptrs.push({ x: X(i), y: BASE + 6, label: "i", col: C.green, up: true });
      if (j !== null && j < hi) rec.ptrs.push({ x: X(j), y: BASE + 50, label: "j", col: C.blue, up: true });
      rec.zones = lo <= hi ? [{ x: X(lo) - 44, y: 92, w: X(hi) - X(lo) + 88, h: 488, col: C.blue, label: `quicksort(a, ${lo}, ${hi})` }] : [];
      rec.vars = stack.length ? "call stack: " + stack.map(([l, h]) => `qs(${l},${h})`).join(" → ") : "";
    }

    rec.extra = legend([["≤ pivot", "#2b7a5c"], ["> pivot", "#8a6427"], ["pivot", C.violet], ["final", C.green]]);
    rec.mark("Start");
    rec.card("Quicksort", "Lecture 9 · the slide's example, [2, 8, 7, 1, 3, 5, 6, 4]", 4.5,
      "Pick one item, put it in its final place, then sort each side. Nothing ever needs merging.");
    function qs(lo, hi, depth) {
      stack.push([lo, hi]);
      if (lo >= hi) {
        if (lo === hi) {
          final.add(lo);
          paint({ lo, hi });
          rec.snap(`quicksort(${lo}, ${hi}): one item, so **lo < hi is false**. ${a[lo]} is already in place.`, [1, 2], 2.2);
        } else {
          paint({ lo, hi: lo - 1 });
          rec.snap(`quicksort(${lo}, ${hi}): an empty range. Line 2 is false, return right away.`, [1, 2], 1.6);
        }
        stack.pop();
        return;
      }
      const pivot = a[hi];
      if (depth === 0) rec.mark("First partition");
      else if (lo === 0 && hi === 2) rec.mark("Left side");
      else if (lo === 4 && hi === n - 1) rec.mark("Right side");
      paint({ lo, hi, pivotAt: hi });
      rec.snap(depth === 0
        ? `Line 2: lo < hi, so partition. The pivot is the LAST item: **${pivot}** (purple).`
        : `quicksort(${lo}, ${hi}): partition this range around its last item, **${pivot}**.`, [1, 2, 3, 7, 8], depth === 0 ? 3.2 : 2.6);
      let i = lo - 1;
      const slow = depth === 0;
      if (slow) {
        paint({ lo, hi, i, j: lo, pivotAt: hi });
        rec.snap(`i = ${lo} − 1 = ${i}: the green "≤ ${pivot}" zone is empty. j scouts from left to right.`, [9, 10], 3.2);
      }
      for (let j = lo; j < hi; j++) {
        const small = a[j] <= pivot;
        paint({ lo, hi, i, j, pivotAt: hi, scout: j });
        rec.snap(small
          ? `j = ${j}: is ${a[j]} ≤ ${pivot}? **Yes**. It belongs in the green zone.`
          : `j = ${j}: is ${a[j]} ≤ ${pivot}? **No**. Walk past it: it joins the amber "> ${pivot}" zone.`, small ? [10, 11] : [10, 11], slow ? 2.6 : 1.7);
        if (small) {
          i++;
          const same = i === j;
          [a[i], a[j]] = [a[j], a[i]];
          paint({ lo, hi, i, j: j + 1, pivotAt: hi, swap: same ? [] : [i, j] });
          rec.snap(same ? `i = ${i}. Swapping a[${i}] with itself: nothing moves, the green zone just grows.`
                        : `i = ${i}, then swap a[${i}] and a[${j}]: ${a[i]} jumps into the green zone.`, [12, 13], slow ? 2.8 : 1.9);
        }
      }
      paint({ lo, hi, i, j: hi, pivotAt: hi, swap: [i + 1, hi] });
      rec.snap(`j reached the pivot. Last move: swap the pivot into a[i + 1] = a[${i + 1}].`, [14], slow ? 2.8 : 2);
      [a[i + 1], a[hi]] = [a[hi], a[i + 1]];
      const p = i + 1;
      final.add(p);
      paint({ lo, hi, i, pivotAt: p });
      rec.snap(`**${pivot} is final** at index ${p}: everything left is ≤ ${pivot}, everything right is bigger.`, [14, 15, 3], slow ? 3.4 : 2.6);
      paint({ lo, hi: p - 1 });
      rec.snap(`Line 4: sort the left side, a[${lo}..${p - 1}]. This call **waits** until that one returns.`, [4], 2.4);
      qs(lo, p - 1, depth + 1);
      paint({ lo: p + 1, hi });
      rec.snap(`Back in quicksort(${lo}, ${hi}). Line 5: now sort the right side, a[${p + 1}..${hi}].`, [5], 2.4);
      qs(p + 1, hi, depth + 1);
      stack.pop();
    }
    qs(0, n - 1, 0);
    paint({ lo: 0, hi: n - 1 });
    rec.zones = [];
    rec.snap("Sorted, in place. Each partition is **O(n)**; balanced splits give **O(n log n)** on average.", [], 4.5);
    rec.mark("Runtime");
    rec.card("Worst case: O(n²)", "An already sorted array makes every pivot the max: splits of n − 1 and 0", 5,
      "Real libraries pick a random or median-of-three pivot to make that almost impossible.");
  },
});
</script></body></html>
